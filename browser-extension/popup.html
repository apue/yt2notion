<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bilingual subtitles</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">文</div>
        <div>
          <h1>Bilingual subtitles</h1>
          <p id="page-status">Open a YouTube video to begin.</p>
        </div>
      </header>

      <section class="card import-card">
        <div class="section-heading">
          <span>Subtitle package</span>
          <span id="package-badge" class="badge">Not loaded</span>
        </div>
        <p id="package-details" class="details">Import the JSON generated by <code>subtitle-pack</code>.</p>
        <label class="file-button">
          <input id="package-file" type="file" accept="application/json,.json" />
          <span>Choose bilingual_subtitles.json</span>
        </label>
        <button id="remove-package" class="secondary" type="button" hidden>Remove from this video</button>
      </section>

      <section class="card controls">
        <label class="toggle-row">
          <span>
            <strong>Show subtitles</strong>
            <small>Turn YouTube captions off separately.</small>
          </span>
          <input id="enabled" type="checkbox" checked />
        </label>
        <label class="range-row">
          <span>Text size</span>
          <input id="font-scale" type="range" min="0.75" max="1.5" step="0.05" value="1" />
          <output id="font-scale-value">100%</output>
        </label>
        <label class="range-row">
          <span>Vertical position</span>
          <input id="bottom-offset" type="range" min="3" max="30" step="1" value="9" />
          <output id="bottom-offset-value">9%</output>
        </label>
      </section>

      <p id="message" class="message" role="status"></p>
    </main>
    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
